<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva e Aluguel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="nav">
    <a href="index.html">Início</a>
    <a href="residencias.html">Residências</a>
    <a href="reserva.html">Reserva/Aluguel</a>
    <a href="recibo.html">Recibo</a>
  </div>
  <div class="container">
    <div class="card">
      <h2>Novo cliente (opcional)</h2>
      <p class="hint">Cadastre antes se ainda não existir na lista abaixo.</p>
      <div class="grid">
        <div>
          <label for="cli-nome">Nome</label>
          <input id="cli-nome" type="text" placeholder="Ana Beatriz" />
          <label for="cli-cpf">CPF</label>
          <input id="cli-cpf" type="text" placeholder="12345678900" />
        </div>
        <div>
          <label for="cli-email">Email</label>
          <input id="cli-email" type="text" placeholder="ana@email.com" />
        </div>
      </div>
      <button type="button" id="btn-novo-cliente" class="btn btn-secondary">Cadastrar cliente</button>
    </div>

    <div class="card">
      <h2>Reserva / aluguel</h2>
      <p class="hint">A API trabalha com <strong>datas</strong> (sem horário). Escolha cliente, residência e quarto já cadastrados.</p>
      <div class="grid">
        <div>
          <label for="sel-cliente">Cliente</label>
          <select id="sel-cliente"></select>
          <label for="sel-residencia">Residência</label>
          <select id="sel-residencia"></select>
          <label for="sel-quarto">Quarto</label>
          <select id="sel-quarto"></select>
        </div>
        <div>
          <label for="data-inicio">Data de entrada</label>
          <input id="data-inicio" type="date" />
          <label for="data-fim">Data de saída</label>
          <input id="data-fim" type="date" />
          <label for="num-hospedes">Número de hóspedes</label>
          <input id="num-hospedes" type="number" min="1" value="2" />
          <label class="chk-line">
            <input id="chk-berco" type="checkbox" />
            Solicita berço
          </label>
        </div>
      </div>
      <button type="button" id="btn-confirmar-aluguel" class="btn">Confirmar aluguel</button>
      <p id="msg-reserva" class="banner hidden" role="status"></p>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="reserva.js"></script>
</body>
</html>
