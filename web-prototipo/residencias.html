<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Residências</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="nav">
    <a href="index.html">Início</a>
    <a href="residencias.html">Residências</a>
    <a href="reserva.html">Reserva/Aluguel</a>
    <a href="recibo.html">Recibo</a>
  </div>
  <div class="container">
    <div class="card">
      <h2>Cadastro de Residência</h2>
      <div class="grid">
        <div>
          <label>Endereço</label>
          <input type="text" value="Rua das Piscinas Naturais" />
          <label>Número</label>
          <input type="text" value="120" />
          <label>Bairro</label>
          <input type="text" value="Centro" />
        </div>
        <div>
          <label>CEP</label>
          <input type="text" value="45520-000" />
          <label>Telefone</label>
          <input type="text" value="(73) 99999-9999" />
          <label>Email</label>
          <input type="text" value="contato@residenciamarau.com" />
        </div>
      </div>
      <button class="btn">Salvar</button>
    </div>

    <div class="card">
      <h2>Quartos da Residência</h2>
      <div class="grid">
        <div>
          <label>Tipo</label>
          <select><option>INDIVIDUAL</option></select>
          <label>Valor base</label>
          <input type="text" value="160.00" />
          <label>Ar condicionado</label>
          <select><option>Sim</option></select>
        </div>
        <div>
          <label>Hidromassagem</label>
          <select><option>Não</option></select>
          <label>Tipo</label>
          <select><option>CASAL</option></select>
          <label>Valor base</label>
          <input type="text" value="220.00" />
        </div>
      </div>
      <button class="btn">Adicionar quarto</button>
    </div>
  </div>
</body>
</html>
